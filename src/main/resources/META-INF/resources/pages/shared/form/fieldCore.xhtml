<!-- /pages/shared/field/fieldCore.xhtml -->
<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://java.sun.com/jsf/html"

             xmlns:siaInplace="http://xmlns.jcp.org/jsf/composite/pages/shared/inplace"
             xmlns:c="http://java.sun.com/jsp/jstl/core">

    <!-- Expected @elvariable parameters -->
    <!--@elvariable id="bean" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="formCtx" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="col" type="fr.siamois.ui.table.column.TableColumn"-->
    <!--@elvariable id="prefix" type="java.lang.String"-->
    <!--@elvariable id="statusIndex" type="java.lang.Integer"-->
    <!--@elvariable id="rowIndex" type="java.lang.Integer"-->
    <!--@elvariable id="colIndex" type="java.lang.Integer"-->
    <!--@elvariable id="root" type="java.lang.String"-->
    <!--@elvariable id="panelIndex" type="java.lang.Integer"-->
    <!--@elvariable id="hasBeenModified" type="java.lang.Boolean"-->
    <!--@elvariable id="answer" type="fr.siamois.ui.viewmodel.fieldanswer.CustomFieldAnswerViewModel"-->
    <!--@elvariable id="onModified" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelHeaderUpdateId" type="java.lang.String"-->
    <!--@elvariable id="hasAutoGenerationFunction" type="java.lang.Boolean"-->
    <!--@elvariable id="onGenerateValue" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelStyleClass" type="java.lang.String"-->
    <!-- @elvariable id="conceptFieldsUpdateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="updateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="spatialUnitOptions" type="java.util.List" -->
    <!-- @elvariable id="mode" type="java.lang.String" -->
    <!-- @elvariable id="panelId" type="java.lang.String" -->

    <!-- TEXT -->
    <c:if test="#{(col['class'].simpleName eq 'FormFieldColumn') or col['class'].simpleName eq 'CustomColUiDto'}">

        <!--
            'lightTable' (table cells only, see customFormFieldContentForTable.xhtml): the cell
            isn't the active one, so it must not instantiate a real edit widget. Text fields get a
            genuinely plain-text rendering here; every other field type keeps its existing
            'output' display (effectiveMode below), wrapped so a click still switches it to
            'input'. Either way, clicking activates tableModel.activateCell and re-renders just
            this cell (cellUpdateTarget) — never the whole row or table.
        -->
        <ui:param name="effectiveMode" value="#{mode eq 'lightTable' ? 'output' : mode}"/>
        <ui:param name="isLightTableCell" value="#{mode eq 'lightTable'}"/>

        <c:if test="#{isLightTableCell and col.field['class'].simpleName eq 'CustomFieldText'}">
            <p:commandLink styleClass="sia-cell-activate sia-cell-text" ajax="true" process="@this"
                           action="#{tableModel.activateCell(rowItem, col)}"
                           update="#{cellUpdateTarget}">
                <h:outputText value="#{answer.value}"/>
            </p:commandLink>
        </c:if>

        <p:outputPanel rendered="#{not (isLightTableCell and col.field['class'].simpleName eq 'CustomFieldText')}"
                       styleClass="#{isLightTableCell ? 'sia-cell-activate' : ''}">
            <p:ajax event="click" process="@this" disabled="#{not isLightTableCell}"
                    listener="#{tableModel.activateCell(rowItem, col)}"
                    update="#{cellUpdateTarget}"/>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldText'}">
            <siaInplace:text
                    id="text"
                    field="#{col.field}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    hasBeenModified="#{hasBeenModified}"
                    answer="#{answer}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    hasAutoGenerationFunction="#{hasAutoGenerationFunction}"
                    onGenerateValue="#{onGenerateValue}"
            />
        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldInteger'}">
            <!-- INTEGER -->
            <siaInplace:integer
                    id="integer"
                    panelModel="#{bean}"
                    field="#{col.field}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    hasBeenModified="#{hasBeenModified}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    answer="#{answer}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
            />
        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldDecimal'}">
            <!-- DECIMAL -->
            <siaInplace:decimal
                    id="decimal"
                    panelModel="#{bean}"
                    field="#{col.field}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    hasBeenModified="#{hasBeenModified}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    answer="#{answer}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
            />
        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldDateTime'}">
            <!-- DATETIME -->
            <siaInplace:datePicker
                    id="datePicker"
                    panelId="#{panelId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    field="#{col.field}"
                    hasBeenModified="#{hasBeenModified}"
                    answer="#{answer}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    panelStyleClass="#{panelStyleClass}"
            />
        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneFromFieldCode'
                   or col.field['class'].simpleName eq 'CustomFieldSelectMultipleFromFieldCode'
                   or col.field['class'].simpleName eq 'CustomFieldSelectOne'
                   or col.field['class'].simpleName eq 'CustomFieldSelectMultiple'}">
            <!-- CONCEPT -->
            <siaInplace:concept
                    id="concept"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    multiple="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleFromFieldCode' or col.field['class'].simpleName eq 'CustomFieldSelectMultiple'}"
                    panelId="#{panelId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{conceptFieldsUpdateTargetsOnBlur} #{updateTargetsOnBlur}"
                    answer="#{answer}"
                    panelStyleClass="#{panelStyleClass}"
                    onConceptChanged="#{formCtx.setFieldConceptAnswerHasBeenModified}"
                    dependsOnBaseConcept="#{formCtx.getDependsOnBaseConcept(col.field)}"
                    formCtx="#{formCtx}"
            />
        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneActionUnit'}">
            <!-- Select one action -->
            <siaInplace:action
                    id="action"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    mode="#{effectiveMode}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    updateTargetsOnBlur="#{updateTargetsOnBlur}"
                    answer="#{answer}"/>

        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneSpatialUnit'}">
            <siaInplace:spatial
                    id="spatial"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectOneSpatialUnit'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    spatialUnitOptions="#{spatialUnitOptions}"
                    answer="#{answer}"
            />
        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOnePerson'}">
            <!-- Select one from person -->
            <siaInplace:person
                    id="onePerson"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectOnePerson'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    mode="#{effectiveMode}"
                    panelStyleClass="#{panelStyleClass}"
                    required="#{col.required}"
                    panelId="#{panelId}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    answer="#{answer}"/>

        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultiplePerson'}">
            <!-- Select multiple from person -->
            <siaInplace:person
                    id="multiplePerson"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectMultiplePerson'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    multiple="true"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    mode="#{effectiveMode}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    panelStyleClass="#{panelStyleClass}"
                    updateTargetsOnBlur="#{updateTargetsOnBlur}"
                    answer="#{answer}"/>

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleContainer'}">

            <siaInplace:containerMultiple
                    id="containerMultiple"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleContainer'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="true"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    answer="#{answer}"
            />

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultiplePhase'}">

            <siaInplace:phaseMultiple
                    id="phaseMultiple"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="true"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    answer="#{answer}"
            />

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleSpatialUnitTree'}">

            <siaInplace:spatialMultiple
                    id="spatialMultiple"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleSpatialUnitTree'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="true"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    compact="#{compact}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    spatialUnitOptions="#{spatialUnitOptions}"
                    answer="#{answer}"
            />

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleSpecimen'}">

            <siaInplace:specimen
                    id="specimen"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleSpecimen'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="true"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    spatialUnitOptions="#{spatialUnitOptions}"
                    answer="#{answer}"
            />

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleRecordingUnit'}">

            <siaInplace:recordingUnitMultiple
                    id="recordingUnitMultiple"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectMultipleRecordingUnit'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="true"
                    mode="#{effectiveMode}"
                    compact="#{compact}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    spatialUnitOptions="#{spatialUnitOptions}"
                    answer="#{answer}"
            />

        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneRecordingUnit'}">
            <siaInplace:recordingUnitMultiple
                    id="recordingUnitOne"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectOneRecordingUnit'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    formCtx="#{formCtx}"
                    multiple="false"
                    mode="#{effectiveMode}"
                    compact="#{compact}"
                    panelId="#{panelId}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{panelHeaderUpdateId}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    spatialUnitOptions="#{spatialUnitOptions}"
                    answer="#{answer}"
            />

        </c:if>


        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneActionCode'}">
            <!-- Select one code OA -->
            <siaInplace:actionCode
                    id="actionCode"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectOneActionCode'}"
                    field="#{col.field}"
                    required="#{col.required}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    hasBeenModified="#{hasBeenModified}"
                    answer="#{answer}"
                    mode="#{effectiveMode}"
                    updateTargetsOnBlur="#{updateTargetsOnBlur}"
            />
        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldSelectOneAddress'}">
            <siaInplace:address
                    id="address"
                    formCtx="#{formCtx}"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldSelectOneAddress'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    mode="#{effectiveMode}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{updateTargetsOnBlur}"
                    required="#{col.required}"
                    answer="#{answer}"
            />
        </c:if>

        <c:if test="#{col.field['class'].simpleName eq 'CustomFieldMeasurement'}">
            <siaInplace:measurement
                    id="measurement"
                    formCtx="#{formCtx}"
                    rendered="#{col.field['class'].simpleName eq 'CustomFieldMeasurement'}"
                    hasBeenModified="#{hasBeenModified}"
                    field="#{col.field}"
                    mode="#{effectiveMode}"
                    panelId="#{panelId}"
                    label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                    onModified="#{formCtx.onFieldAnswerModifiedListener}"
                    updateTargetsOnBlur="#{updateTargetsOnBlur}"
                    required="#{col.required}"
                    answer="#{answer}"
            />
        </c:if>

        </p:outputPanel>

    </c:if>






















</ui:fragment>
