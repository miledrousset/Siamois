<!-- /pages/shared/field/fieldCore.xhtml -->
<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

             xmlns:siaInplace="http://xmlns.jcp.org/jsf/composite/pages/shared/inplace"
             xmlns:c="http://java.sun.com/jsp/jstl/core">

    <!-- Expected @elvariable parameters -->
    <!--@elvariable id="bean" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="formCtx" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="col" type="fr.siamois.ui.table.column.TableColumn"-->
    <!--@elvariable id="prefix" type="java.lang.String"-->
    <!--@elvariable id="statusIndex" type="java.lang.Integer"-->
    <!--@elvariable id="rowIndex" type="java.lang.Integer"-->
    <!--@elvariable id="colIndex" type="java.lang.Integer"-->
    <!--@elvariable id="root" type="java.lang.String"-->
    <!--@elvariable id="panelIndex" type="java.lang.Integer"-->
    <!--@elvariable id="hasBeenModified" type="java.lang.Boolean"-->
    <!--@elvariable id="answer" type="fr.siamois.ui.viewmodel.fieldanswer.CustomFieldAnswerViewModel"-->
    <!--@elvariable id="onModified" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelHeaderUpdateId" type="java.lang.String"-->
    <!--@elvariable id="hasAutoGenerationFunction" type="java.lang.Boolean"-->
    <!--@elvariable id="onGenerateValue" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelStyleClass" type="java.lang.String"-->
    <!-- @elvariable id="conceptFieldsUpdateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="updateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="spatialUnitOptions" type="java.util.List" -->
    <!-- @elvariable id="mode" type="java.lang.String" -->
    <!-- @elvariable id="panelId" type="java.lang.String" -->

    <c:if test="#{(col['class'].simpleName eq 'FormFieldColumn') or col['class'].simpleName eq 'CustomColUiDto'}">

        <!--
            Aiguillage sur CustomField#getKind() : une seule lecture du modèle, là où chacune des
            branches lisait auparavant field['class'].simpleName. Le c:choose s'arrête en outre
            à la première branche retenue, au lieu d'évaluer les dix-huit conditions.
            Les composites n'ont pas besoin de répéter la condition dans un rendered : la branche
            non retenue n'est pas construite du tout.
        -->
        <c:set var="fieldKind" value="#{col.field.kind}"/>

        <c:choose>

            <!-- TEXT -->
            <c:when test="#{fieldKind eq 'CustomFieldText'}">
                <siaInplace:text
                        id="text"
                        field="#{col.field}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        hasBeenModified="#{hasBeenModified}"
                        answer="#{answer}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        hasAutoGenerationFunction="#{hasAutoGenerationFunction}"
                        onGenerateValue="#{onGenerateValue}"
                />
            </c:when>

            <!-- INTEGER -->
            <c:when test="#{fieldKind eq 'CustomFieldInteger'}">
                <siaInplace:integer
                        id="integer"
                        panelModel="#{bean}"
                        field="#{col.field}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        hasBeenModified="#{hasBeenModified}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        answer="#{answer}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                />
            </c:when>

            <!-- DECIMAL -->
            <c:when test="#{fieldKind eq 'CustomFieldDecimal'}">
                <siaInplace:decimal
                        id="decimal"
                        panelModel="#{bean}"
                        field="#{col.field}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        hasBeenModified="#{hasBeenModified}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        answer="#{answer}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                />
            </c:when>

            <!-- DATETIME -->
            <c:when test="#{fieldKind eq 'CustomFieldDateTime'}">
                <siaInplace:datePicker
                        id="datePicker"
                        panelId="#{panelId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        field="#{col.field}"
                        hasBeenModified="#{hasBeenModified}"
                        answer="#{answer}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        panelStyleClass="#{panelStyleClass}"
                />
            </c:when>

            <!-- CONCEPT -->
            <c:when test="#{fieldKind eq 'CustomFieldSelectOneFromFieldCode'
                         or fieldKind eq 'CustomFieldSelectMultipleFromFieldCode'
                         or fieldKind eq 'CustomFieldSelectOne'
                         or fieldKind eq 'CustomFieldSelectMultiple'}">
                <siaInplace:concept
                        id="concept"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        multiple="#{col.field.kind eq 'CustomFieldSelectMultipleFromFieldCode' or col.field.kind eq 'CustomFieldSelectMultiple'}"
                        panelId="#{panelId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{conceptFieldsUpdateTargetsOnBlur} #{updateTargetsOnBlur}"
                        answer="#{answer}"
                        panelStyleClass="#{panelStyleClass}"
                        onConceptChanged="#{formCtx.setFieldConceptAnswerHasBeenModified}"
                        dependsOnBaseConcept="#{formCtx.getDependsOnBaseConcept(col.field)}"
                        formCtx="#{formCtx}"
                />
            </c:when>

            <!-- Select one action -->
            <c:when test="#{fieldKind eq 'CustomFieldSelectOneActionUnit'}">
                <siaInplace:action
                        id="action"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        mode="#{mode}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        updateTargetsOnBlur="#{updateTargetsOnBlur}"
                        answer="#{answer}"/>
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectOneSpatialUnit'}">
                <siaInplace:spatial
                        id="spatial"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        spatialUnitOptions="#{spatialUnitOptions}"
                        answer="#{answer}"
                />
            </c:when>

            <!-- Select one from person -->
            <c:when test="#{fieldKind eq 'CustomFieldSelectOnePerson'}">
                <siaInplace:person
                        id="onePerson"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        mode="#{mode}"
                        panelStyleClass="#{panelStyleClass}"
                        required="#{col.required}"
                        panelId="#{panelId}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        answer="#{answer}"/>
            </c:when>

            <!-- Select multiple from person -->
            <c:when test="#{fieldKind eq 'CustomFieldSelectMultiplePerson'}">
                <siaInplace:person
                        id="multiplePerson"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        multiple="true"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        mode="#{mode}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        panelStyleClass="#{panelStyleClass}"
                        updateTargetsOnBlur="#{updateTargetsOnBlur}"
                        answer="#{answer}"/>
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectMultipleContainer'}">
                <siaInplace:containerMultiple
                        id="containerMultiple"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="true"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectMultiplePhase'}">
                <siaInplace:phaseMultiple
                        id="phaseMultiple"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="true"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectMultipleSpatialUnitTree'}">
                <siaInplace:spatialMultiple
                        id="spatialMultiple"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="true"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        compact="#{compact}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        spatialUnitOptions="#{spatialUnitOptions}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectMultipleSpecimen'}">
                <siaInplace:specimen
                        id="specimen"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="true"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        spatialUnitOptions="#{spatialUnitOptions}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectMultipleRecordingUnit'}">
                <siaInplace:recordingUnitMultiple
                        id="recordingUnitMultiple"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="true"
                        mode="#{mode}"
                        compact="#{compact}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        spatialUnitOptions="#{spatialUnitOptions}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectOneRecordingUnit'}">
                <siaInplace:recordingUnitMultiple
                        id="recordingUnitOne"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        formCtx="#{formCtx}"
                        multiple="false"
                        mode="#{mode}"
                        compact="#{compact}"
                        panelId="#{panelId}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{panelHeaderUpdateId}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        spatialUnitOptions="#{spatialUnitOptions}"
                        answer="#{answer}"
                />
            </c:when>

            <!-- Select one code OA -->
            <c:when test="#{fieldKind eq 'CustomFieldSelectOneActionCode'}">
                <siaInplace:actionCode
                        id="actionCode"
                        field="#{col.field}"
                        required="#{col.required}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        hasBeenModified="#{hasBeenModified}"
                        answer="#{answer}"
                        mode="#{mode}"
                        updateTargetsOnBlur="#{updateTargetsOnBlur}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldSelectOneAddress'}">
                <siaInplace:address
                        id="address"
                        formCtx="#{formCtx}"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        mode="#{mode}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{updateTargetsOnBlur}"
                        required="#{col.required}"
                        answer="#{answer}"
                />
            </c:when>

            <c:when test="#{fieldKind eq 'CustomFieldMeasurement'}">
                <siaInplace:measurement
                        id="measurement"
                        formCtx="#{formCtx}"
                        hasBeenModified="#{hasBeenModified}"
                        field="#{col.field}"
                        mode="#{mode}"
                        panelId="#{panelId}"
                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(col.field)}"
                        onModified="#{formCtx.onFieldAnswerModifiedListener}"
                        updateTargetsOnBlur="#{updateTargetsOnBlur}"
                        required="#{col.required}"
                        answer="#{answer}"
                />
            </c:when>

        </c:choose>

    </c:if>

</ui:fragment>
