<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://java.sun.com/jsf/html"

>

            <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.single.AbstractSingleEntityPanel" -->
            <p:commandButton
                    value="Ajouter un document"
                    action="#{panelModel.initDialog()}"
                    process="@this"
            />
            <h:panelGroup id="suDocumentsTab">
                <!-- Pas de p:autoUpdate ici : il réinjectait ce tableau dans chaque réponse ajax de la page.
                     L'ajout d'un document rafraîchit déjà le panneau entier (AbstractSingleEntityPanel#saveDocument). -->
                <p:dataTable
                        value="#{panelModel.documents}"
                        var="siamoisDocument"
                        paginator="true"
                        rows="10"
                        paginatorPosition="bottom"
                >
                    <p:column headerText="Titre">
                        <h:outputText value="#{siamoisDocument.title}"/>
                    </p:column>

                    <p:column headerText="Nature">
                        <h:outputText value="#{labelBean.findLabelOfConcept(siamoisDocument.nature)}"/>
                    </p:column>

                    <p:column headerText="Grandeur">
                        <h:outputText value="#{labelBean.findLabelOfConcept(siamoisDocument.scale)}"/>
                    </p:column>

                    <p:column headerText="Type de document">
                        <h:outputText value="#{labelBean.findLabelOfConcept(siamoisDocument.format)}"/>
                    </p:column>

                    <p:column headerText="Auteur">
                        <h:outputText value="#{siamoisDocument.createdBy.displayName()}"/>
                    </p:column>

                    <p:column>
                        <h:panelGroup rendered="#{panelModel.contentIsImage(siamoisDocument.mimeType)}">
                            <p:button
                                    value="Visualiser"
                                    onclick="window.open('#{siamoisDocument.url}');return false"/>
                        </h:panelGroup>
                    </p:column>

                    <p:column>
                        <p:commandButton
                                value="Télécharger"
                                ajax="true"
                                styleClass="mr-2"
                                rendered="#{not empty siamoisDocument.fileCode}">
                            <p:fileDownload value="#{panelModel.streamOf(siamoisDocument)}"/>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </h:panelGroup>


</ui:fragment>
