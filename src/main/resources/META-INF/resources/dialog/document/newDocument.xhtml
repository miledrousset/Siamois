<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:sharedInput="http://xmlns.jcp.org/jsf/composite/pages/shared/input"

>

    <h:form id="newDocument" enctype="multipart/form-data">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <p:dialog widgetVar="newDocumentDiag" id="newDocumentDiag" showEffect="fade" closeOnEscape="true"
                  fitViewport="true"
                  width="60vw"
                  minWidth="400"
                  maxWidth="90vw"
                  style="max-height:900px;"
                  appendToBody="true" modal="true"
                  styleClass="sia-new-unit-dialog ui-panel siamois-panel container-panel">

            <f:facet name="header">
                <p:outputPanel style="display: flex;gap: 0.5em; align-items: center;
                        float:left;color: var(--main-color);">
                    <i class="pi pi-file" style="font-size:2rem;"/>
                    <span style="padding-right:0.5em;">Création d'un document</span>
                </p:outputPanel>
            </f:facet>

            <div class="ui-g ui-fluid">
                <div class="ui-g-12 ui-md-6 ui-lg-6">
                    <label class="col-form-label" for="title">Titre *</label>
                    <p:inputText
                            id="title"
                            value="#{documentCreationBean.docTitle}"
                            maxlength="#{documentCreationBean.maxTitleLength()}"
                    />
                </div>
                <div class="ui-g-12 ui-md-6 ui-lg-6">
                    <label class="col-form-label" for="nature">Nature *</label>
                    <sharedInput:conceptAutocomplete
                            id="nature"
                            editConceptUrl=""
                            required="false"
                            selectedConcept="#{documentCreationBean.docNature}"
                            completeMethod="#{documentCreationBean.autocompleteNature}"/>
                </div>
            </div>
            <div class="ui-g ui-fluid">
                <div class="ui-g-12 ui-md-6 ui-lg-6">
                    <label class="col-form-label" for="type">Type *</label>
                    <sharedInput:conceptAutocomplete
                            id="type"
                            editConceptUrl=""
                            required="false"
                            selectedConcept="#{documentCreationBean.docType}"
                            completeMethod="#{documentCreationBean.autocompleteType}"/>
                </div>
                <div class="ui-g-12 ui-md-6 ui-lg-6">
                    <label class="col-form-label" for="scale">Scale</label>
                    <sharedInput:conceptAutocomplete
                            id="scale"
                            editConceptUrl=""
                            required="false"
                            selectedConcept="#{documentCreationBean.docScale}"
                            completeMethod="#{documentCreationBean.autocompleteScale}"/>
                </div>
            </div>
            <div class="ui-g ui-fluid">
                <div class="ui-g-12">
                    <label class="col-form-label" for="description">Description</label>
                    <p:inputTextarea
                            id="description"
                            value="#{documentCreationBean.docDescription}"
                            maxlength="#{documentCreationBean.maxDescriptionSize()}"
                    />
                </div>
            </div>
            <div class="ui-g ui-fluid">
                <div class="ui-g-12">
                    <label class="col-form-label" for="file">Fichier</label>
                    <p:fileUpload
                            id="file"
                            value="#{documentCreationBean.docFile}"
                            mode="simple"
                            accept="#{documentCreationBean.allowedExtensions()}"
                    >
                        <p:validateFile
                                sizeLimit="#{documentCreationBean.maxFileSize()}"
                                allowTypes="#{documentCreationBean.regexSupportedTypes()}"/>
                    </p:fileUpload>
                </div>
            </div>

            <f:facet name="footer">
                <div style="background-color: var(--siamois-green-light-100);">
                    <p:toolbar class="panel-footer">
                        <p:toolbarGroup align="right">
                            <p:commandLink value='#{langBean.msg("common.action.cancel")}'
                                           oncomplete="PF('newDocumentDiag').hide()"
                                           immediate="true"
                                           style="margin-right: 1rem">
                            </p:commandLink>
                            <p:commandButton id="createButton"
                                    action="#{documentCreationBean.callActionOnSave}"
                                    value="Ajouter le document"
                                    style="margin-right: 1rem"
                            />
                        </p:toolbarGroup>
                    </p:toolbar>
                </div>
            </f:facet>

        </p:dialog>
    </h:form>

</ui:fragment>
